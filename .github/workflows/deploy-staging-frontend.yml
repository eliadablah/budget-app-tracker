# .github/workflows/deploy-staging-frontend.yml
# What: the staging copy of deploy-frontend.yml. When a change to frontend/
#       lands on develop, this builds the site against the STAGING API and
#       login pool, uploads it to the staging bucket, and clears the staging
#       CloudFront cache.
#
# Uses the staging deploy role, which only trusts the develop branch and can
# only write to the staging bucket and clear the staging distribution.

name: Deploy staging frontend

on:
  push:
    branches: [develop]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-staging-frontend.yml"
  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

permissions:
  id-token: write # required to request the OIDC ID card
  contents: read

concurrency:
  group: deploy-staging-frontend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Not secrets - resource names and IDs from `terraform output` in the staging workspace.
  DEPLOY_ROLE_ARN: arn:aws:iam::277820847315:role/budget-app-staging-github-deploy
  FRONTEND_BUCKET: budget-app-staging-frontend-277820847315
  DISTRIBUTION_ID: E3TE79BP9EKH6V

jobs:
  deploy:
    name: Build, upload, clear cache (staging)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      # Staging's own API address and login pool, baked into the build. These
      # are public by nature (every visitor's browser downloads them).
      - name: Build
        env:
          VITE_API_URL: https://0ujcfbw3lc.execute-api.us-east-1.amazonaws.com/
          VITE_AWS_REGION: us-east-1
          VITE_COGNITO_CLIENT_ID: 5tvibuttcm17lbkuoo3it9j9rf
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 sync dist "s3://$FRONTEND_BUCKET" --delete

      - name: Clear the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query Invalidation.Status --output text
